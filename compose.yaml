services:
  postgres:
    image: postgres:17-alpine
    container_name: tareh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tareh}
      POSTGRES_USER: ${POSTGRES_USER:-tareh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tareh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tareh} -d ${POSTGRES_DB:-tareh}"]
      interval: 5s
      timeout: 5s
      retries: 15
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: tareh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - tareh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

volumes:
  tareh-postgres-data:
  tareh-redis-data:

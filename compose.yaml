services:
  postgres:
    image: postgres:17-alpine
    container_name: tareh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tareh}
      POSTGRES_USER: ${POSTGRES_USER:-tareh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tareh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tareh} -d ${POSTGRES_DB:-tareh}"]
      interval: 5s
      timeout: 5s
      retries: 15
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: tareh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - tareh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tareh-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tareh}:${POSTGRES_PASSWORD:-change_this_local_password}@postgres:5432/${POSTGRES_DB:-tareh}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in root .env}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Set OTP_HASH_SECRET in root .env}
      OTP_CODE_TTL_SECONDS: ${OTP_CODE_TTL_SECONDS:-300}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_PER_HOUR: ${OTP_MAX_PER_HOUR:-3}
      SPORTRADAR_API_KEY: ${SPORTRADAR_API_KEY:-}
      SPORTRADAR_ACCESS_LEVEL: ${SPORTRADAR_ACCESS_LEVEL:-trial}
      SPORTRADAR_LANGUAGE: ${SPORTRADAR_LANGUAGE:-en}
      SPORTRADAR_API_BASE_URL: ${SPORTRADAR_API_BASE_URL:-https://api.sportradar.com/soccer}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  tareh-postgres-data:
  tareh-redis-data:

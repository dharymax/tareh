name: TAREH CI

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL embedded in the debug APK (use your PC LAN IP for a physical phone)'
        required: false
        default: 'http://10.0.2.2:3000/api/v1/'
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tareh_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm --workspace @tareh/backend run prisma:generate
      - name: Type check
        run: npm --workspace @tareh/backend run typecheck
      - name: Lint
        run: npm --workspace @tareh/backend run lint
      - name: Unit tests
        run: npm --workspace @tareh/backend run test
      - name: Build
        run: npm --workspace @tareh/backend run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build admin
        run: npm --workspace @tareh/admin run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        env:
          TAREH_API_BASE_URL: ${{ inputs.api_base_url || 'http://10.0.2.2:3000/api/v1/' }}
        run: ./gradlew :android:app:assembleDebug --no-daemon "-PtarehApiBaseUrl=$TAREH_API_BASE_URL"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tareh-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

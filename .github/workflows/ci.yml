name: TAREH CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tareh:tareh_ci_password@localhost:5432/tareh_test?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tareh_test
          POSTGRES_USER: tareh
          POSTGRES_PASSWORD: tareh_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tareh -d tareh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://tareh:tareh_ci_password@localhost:5432/tareh_test?schema=public
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Seed reference data
        run: npm run prisma:seed

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  admin:
    name: Admin dashboard checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

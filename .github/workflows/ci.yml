name: TAREH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tareh_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm --workspace @tareh/backend run prisma:generate
      - name: Type check
        run: npm --workspace @tareh/backend run typecheck
      - name: Lint
        run: npm --workspace @tareh/backend run lint
      - name: Unit tests
        run: npm --workspace @tareh/backend run test
      - name: Build
        run: npm --workspace @tareh/backend run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build admin
        run: npm --workspace @tareh/admin run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager "platforms;android-37"
      - name: Build debug APK
        run: ./gradlew :android:app:assembleDebug --no-daemon

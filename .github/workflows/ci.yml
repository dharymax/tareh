name: TAREH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tareh_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm --workspace @tareh/backend run prisma:generate
      - name: Type check
        run: npm --workspace @tareh/backend run typecheck
      - name: Lint
        run: npm --workspace @tareh/backend run lint
      - name: Unit tests
        run: npm --workspace @tareh/backend run test
      - name: Build
        run: npm --workspace @tareh/backend run build
